# Backstop — static SPA (Vite build) served by nginx on the shared Contabo VPS.
# Static files: /opt/backstop/web (contents of app/dist).
# TLS via Let's Encrypt webroot: certbot certonly --webroot -w /var/www/html
#   -d backstop.gudman.xyz   (this box presets authenticator=webroot in cli.ini —
#   do NOT use --nginx here). Auto-renew is handled by the shared certbot timer.

server {
    listen 80;
    listen [::]:80;
    server_name backstop.gudman.xyz;

    # Let's Encrypt HTTP-01 challenge (shared webroot, same as the other domains).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backstop.gudman.xyz;

    ssl_certificate     /etc/letsencrypt/live/backstop.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backstop.gudman.xyz/privkey.pem;

    root /opt/backstop/web;
    index index.html;

    # Content-hashed assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Agent decision feed + entry HTML must always be fresh so redeploys show.
    location = /agent-decisions.json {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: no server-side routes, fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
