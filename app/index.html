<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0f16" />
    <script>
      (() => {
        const key = "backstop:theme";
        const colors = { dark: "#0a0f16", light: "#f6f9fd" };
        let theme = "dark";
        try {
          const saved = window.localStorage.getItem(key);
          theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
        } catch {
          theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", colors[theme]);
      })();
    </script>
    <title>Backstop - Sui depeg cover desk</title>
    <meta
      name="description"
      content="Backstop is a Sui mainnet depeg cover desk with Pyth-settled policies, live proof health, custody evidence, and protocol-ready integration rails."
    />
    <meta property="og:title" content="Backstop - Sui depeg cover desk" />
    <meta
      property="og:description"
      content="Buy, underwrite, and integrate Pyth-settled depeg cover on Sui mainnet with live proof health and verifiable policy state."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://backstop.gudman.xyz" />
    <meta property="og:image" content="https://backstop.gudman.xyz/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    />
    <meta name="twitter:image" content="https://backstop.gudman.xyz/og.png" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
